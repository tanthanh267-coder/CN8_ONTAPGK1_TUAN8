                        "Hình chiếu đứng: Hình chữ nhật kích thước 60 x 30 mm.",
                        "Hình chiếu bằng: Hình chữ nhật kích thước 60 x 40 mm.",
                        "Hình chiếu cạnh: Hình chữ nhật kích thước 40 x 30 mm."
                    ]
                }
            },
            {
                id: 4,
                title: "Câu 4: Trình tự 4 bước đọc bản vẽ chi tiết 'Ống lót' (1.5 điểm)",
                subtitle: "Đề bài: Cho bản vẽ chi tiết 'Ống lót' (bằng đồng, tỉ lệ 1:1, Øngoài 28, Øtrong 20, chiều dài L=30 mm, yêu cầu kỹ thuật: 'Làm tù cạnh').",
                steps: [
                    { step: "Bước 1 (Khung tên)", content: "Tên gọi chi tiết: Ống lót; Vật liệu: Đồng; Tỉ lệ: 1:1." },
                    { step: "Bước 2 (Hình biểu diễn)", content: "Gồm các hình chiếu: Hình chiếu đứng, hình chiếu bằng và các hình biểu diễn khác (nếu có) để diễn tả rõ cấu tạo bên trong và bên ngoài." },
                    { step: "Bước 3 (Kích thước)", content: "Kích thước chung (Đường kính ngoài Ø28 mm, chiều dài 30 mm) và kích thước các thành phần (Đường kính ngoài Ø28 mm, đường kính trong Ø20 mm, chiều dài 30 mm)." },
                    { step: "Bước 4 (Yêu cầu kỹ thuật)", content: "Chỉ dẫn về gia công: Làm tù cạnh." }
                ]
            },
            {
                id: 5,
                title: "Câu 5: Trình tự 4 bước đọc bản vẽ chi tiết 'Gối đỡ' (1.5 điểm)",
                subtitle: "Đề bài: Đọc bản vẽ chi tiết 'Gối đỡ' (Tỉ lệ 1:1, làm bằng thép, dài 50, rộng 25, cao 25, rãnh 30, dày 10, lỗ Ø20, YCKT: Làm tù cạnh, Mạ kẽm).",
                steps: [
                    { step: "Bước 1 (Khung tên)", content: "Tên gọi chi tiết: Gối đỡ; Vật liệu: Thép; Tỉ lệ: 1:1." },
                    { step: "Bước 2 (Hình biểu diễn)", content: "Gồm các hình chiếu: Hình chiếu đứng, hình chiếu bằng và các hình biểu diễn khác (nếu có) để diễn tả rõ cấu tạo bên trong và bên ngoài." },
                    { step: "Bước 3 (Kích thước)", content: "Kích thước chung (dài 50 mm, rộng 25 mm, cao 25 mm) và kích thước các thành phần (rãnh 30 mm, dày 10 mm, lỗ đường kính Ø20)." },
                    { step: "Bước 4 (Yêu cầu kỹ thuật)", content: "Chỉ dẫn gia công (Làm tù cạnh), xử lý bề mặt (Mạ kẽm)." }
                ]
            },
            {
                id: 6,
                title: "Câu 6: Hình chiếu của khối hình trụ (1.5 điểm)",
                subtitle: "Đề bài: Cho vật thể khối hình trụ có đường kính đáy d = 40 mm và chiều cao h = 50 mm.",
                partA: {
                    title: "a) Hình dạng và kích thước các hình chiếu:",
                    items: [
                        "Hình chiếu đứng: Hình chữ nhật kích thước chiều rộng 40 mm (đường kính d), chiều cao 50 mm (chiều cao h).",
                        "Hình chiếu bằng: Hình tròn đường kính d = 40 mm (có đường gạch dài - chấm - mảnh làm tâm)."
                    ]
                },
                partB: {
                    title: "b) Hướng dẫn vẽ bản vẽ:",
                    items: [
                        "Vẽ hình chiếu đứng là hình chữ nhật 40mm x 50mm bằng nét liền đậm.",
                        "Vẽ hình chiếu bằng là đường tròn bán kính R20mm có trục tâm bằng nét gạch dài - chấm - mảnh."
                    ]
                }
            }
        ];

        // --- MAIN APP COMPONENT ---
        function App() {
            const [activeTab, setActiveTab] = useState('quiz1'); // quiz1, quiz2, essay
            
            // Multiple Choice State
            const [mcAnswers, setMcAnswers] = useState({});
            const [mcSubmitted, setMcSubmitted] = useState(false);

            // True/False State
            const [tfAnswers, setTfAnswers] = useState({}); // { '17_a': true, '17_b': false }
            const [tfSubmitted, setTfSubmitted] = useState(false);

            const handleMcSelect = (qId, optionIdx) => {
                if (mcSubmitted) return;
                setMcAnswers(prev => ({ ...prev, [qId]: optionIdx }));
            };

            const handleTfSelect = (qId, itemKey, value) => {
                if (tfSubmitted) return;
                setTfAnswers(prev => ({ ...prev, [`${qId}_${itemKey}`]: value }));
            };

            const calculateMcScore = () => {
                let score = 0;
                MULTIPLE_CHOICE_DATA.forEach(q => {
                    if (mcAnswers[q.id] === q.answer) score += 0.25;
                });
                return score;
            };

            const calculateTfScore = () => {
                let totalScore = 0;
                TRUE_FALSE_DATA.forEach(q => {
                    let correctCount = 0;
                    q.items.forEach(item => {
                        if (tfAnswers[`${q.id}_${item.key}`] === item.correct) {
                            correctCount++;
                        }
                    });
                    if (correctCount === 4) totalScore += 1.0;
                    else if (correctCount === 3) totalScore += 0.5;
                    else if (correctCount === 2) totalScore += 0.25;
                    else if (correctCount === 1) totalScore += 0.1;
                });
                return totalScore;
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-3">
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold tracking-tight">ÔN TẬP GIỮA KÌ 1 - CÔNG NGHỆ 8</h1>
                                <p className="text-indigo-200 text-xs md:text-sm">Năm học 2026 - 2027 | THCS Nguyễn Hữu Thọ</p>
                            </div>
                            <div className="flex bg-indigo-800 p-1 rounded-lg text-sm font-medium">
                                <button 
                                    onClick={() => setActiveTab('quiz1')}
                                    className={`px-3 py-1.5 rounded-md transition ${activeTab === 'quiz1' ? 'bg-white text-indigo-800 shadow' : 'text-indigo-100 hover:text-white'}`}
                                >
                                    Phần I: Trắc Nghiệm (16 câu)
                                </button>
                                <button 
                                    onClick={() => setActiveTab('quiz2')}
                                    className={`px-3 py-1.5 rounded-md transition ${activeTab === 'quiz2' ? 'bg-white text-indigo-800 shadow' : 'text-indigo-100 hover:text-white'}`}
                                >
                                    Phần II: Đúng / Sai (6 câu)
                                </button>
                                <button 
                                    onClick={() => setActiveTab('essay')}
                                    className={`px-3 py-1.5 rounded-md transition ${activeTab === 'essay' ? 'bg-white text-indigo-800 shadow' : 'text-indigo-100 hover:text-white'}`}
                                >
                                    Phần Tự Luận
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Body */}
                    <main className="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6">
                        
                        {/* TAB 1: MULTIPLE CHOICE */}
                        {activeTab === 'quiz1' && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col sm:flex-row justify-between items-center gap-4">
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-800">Phần I: Câu Hỏi Trắc Nghiệm Nhiều Lựa Chọn</h2>
                                        <p className="text-slate-500 text-sm"> Chọn 01 phương án đúng nhất cho mỗi câu. (16 câu - 4.0 điểm)</p>
                                    </div>
                                    {mcSubmitted ? (
                                        <div className="text-right bg-indigo-50 px-4 py-2 rounded-lg border border-indigo-100">
                                            <span className="text-xs text-indigo-600 font-semibold block uppercase">Điểm của bạn</span>
                                            <span className="text-2xl font-black text-indigo-700">{calculateMcScore().toFixed(2)} / 4.0</span>
                                        </div>
                                    ) : (
                                        <button 
                                            onClick={() => setMcSubmitted(true)}
                                            className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-lg shadow transition"
                                        >
                                            Nộp bài Phần I
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-4">
                                    {MULTIPLE_CHOICE_DATA.map((q, idx) => (
                                        <div key={q.id} className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                                            <div className="font-semibold text-slate-800 text-base mb-3">
                                                <span className="text-indigo-600 font-bold mr-2">Câu {idx + 1}:</span>
                                                {q.question}
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                                                {q.options.map((opt, optIdx) => {
                                                    const isSelected = mcAnswers[q.id] === optIdx;
                                                    const isCorrect = q.answer === optIdx;
                                                    let btnStyle = "border-slate-200 hover:border-indigo-300 hover:bg-slate-50 text-slate-700";
                                                    
                                                    if (mcSubmitted) {
                                                        if (isCorrect) {
                                                            btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-800 font-medium";
                                                        } else if (isSelected && !isCorrect) {
                                                            btnStyle = "bg-rose-50 border-rose-400 text-rose-800";
                                                        } else {
                                                            btnStyle = "border-slate-100 text-slate-400 opacity-60";
                                                        }
                                                    } else if (isSelected) {
                                                        btnStyle = "bg-indigo-50 border-indigo-600 text-indigo-900 font-medium shadow-sm";
                                                    }

                                                    return (
                                                        <button
                                                            key={optIdx}
                                                            onClick={() => handleMcSelect(q.id, optIdx)}
                                                            className={`text-left p-3 rounded-lg border text-sm transition flex items-start gap-2 ${btnStyle}`}
                                                        >
                                                            <span className="font-bold">{String.fromCharCode(65 + optIdx)}.</span>
                                                            <span>{opt}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>

                                            {mcSubmitted && (
                                                <div className="mt-3 p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-600">
                                                    <span className="font-semibold text-slate-700">Giải thích: </span>
                                                    {q.explanation}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                {mcSubmitted && (
                                    <div className="text-center pt-4">
                                        <button 
                                            onClick={() => { setMcSubmitted(false); setMcAnswers({}); }}
                                            className="bg-slate-700 hover:bg-slate-800 text-white font-medium px-6 py-2 rounded-lg text-sm transition"
                                        >
                                            Làm lại Phần I
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 2: TRUE / FALSE */}
                        {activeTab === 'quiz2' && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col sm:flex-row justify-between items-center gap-4">
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-800">Phần II: Trắc Nghiệm Đúng / Sai</h2>
                                        <p className="text-slate-500 text-sm">Trong mỗi ý a, b, c, d chọn Đúng (Đ) hoặc Sai (S). (6 câu - 3.0 điểm)</p>
                                    </div>
                                    {tfSubmitted ? (
                                        <div className="text-right bg-indigo-50 px-4 py-2 rounded-lg border border-indigo-100">
                                            <span className="text-xs text-indigo-600 font-semibold block uppercase">Điểm Phần II</span>
                                            <span className="text-2xl font-black text-indigo-700">{calculateTfScore().toFixed(2)} / 6.0</span>
                                        </div>
                                    ) : (
                                        <button 
                                            onClick={() => setTfSubmitted(true)}
                                            className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-lg shadow transition"
                                        >
                                            Nộp bài Phần II
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-6">
                                    {TRUE_FALSE_DATA.map((q) => (
                                        <div key={q.id} className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4">
                                            <div>
                                                <h3 className="font-bold text-indigo-700 text-base">{q.title}</h3>
                                                <p className="text-slate-600 text-sm mt-1">{q.context}</p>
                                            </div>

                                            <div className="space-y-3">
                                                {q.items.map((item) => {
                                                    const userAns = tfAnswers[`${q.id}_${item.key}`];
                                                    const isAnswered = userAns !== undefined;

                                                    return (
                                                        <div key={item.key} className="p-3 border rounded-lg bg-slate-50/50 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-sm">
                                                            <div className="flex-1">
                                                                <span className="font-bold text-slate-700 mr-2">{item.key})</span>
                                                                <span className="text-slate-800">{item.text}</span>
                                                                
                                                                {tfSubmitted && (
                                                                    <div className="mt-1 text-xs text-slate-500">
                                                                        <span className="font-semibold text-slate-600">Đáp án chuẩn: </span>
                                                                        <span className={item.correct ? "text-emerald-600 font-bold" : "text-rose-600 font-bold"}>
                                                                            {item.correct ? "ĐÚNG" : "SAI"}
                                                                        </span> 
                                                                        <span className="ml-2">({item.exp})</span>
                                                                    </div>
                                                                )}
                                                            </div>

                                                            <div className="flex items-center gap-2 shrink-0">
                                                                <button
                                                                    onClick={() => handleTfSelect(q.id, item.key, true)}
                                                                    className={`px-3 py-1.5 rounded text-xs font-bold transition border ${
                                                                        userAns === true 
                                                                            ? (tfSubmitted ? (item.correct ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-rose-600 text-white border-rose-600') : 'bg-indigo-600 text-white border-indigo-600') 
                                                                            : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'
                                                                    }`}
                                                                >
                                                                    Đúng
                                                                </button>
                                                                <button
                                                                    onClick={() => handleTfSelect(q.id, item.key, false)}
                                                                    className={`px-3 py-1.5 rounded text-xs font-bold transition border ${
                                                                        userAns === false 
                                                                            ? (tfSubmitted ? (!item.correct ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-rose-600 text-white border-rose-600') : 'bg-indigo-600 text-white border-indigo-600') 
                                                                            : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'
                                                                    }`}
                                                                >
                                                                    Sai
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {tfSubmitted && (
                                    <div className="text-center pt-4">
                                        <button 
                                            onClick={() => { setTfSubmitted(false); setTfAnswers({}); }}
                                            className="bg-slate-700 hover:bg-slate-800 text-white font-medium px-6 py-2 rounded-lg text-sm transition"
                                        >
                                            Làm lại Phần II
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 3: ESSAY / KIẾN THỨC TRỌNG TÂM */}
                        {activeTab === 'essay' && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                                    <h2 className="text-lg font-bold text-slate-800">Phần Tự Luận: Kiến Thức Trọng Tâm & Gợi Ý Trả Lời</h2>
                                    <p className="text-slate-500 text-sm">Tổng hợp các dạng bài tập tự luận trong đề cương ôn tập giữa kì 1.</p>
                                </div>

                                <div className="grid grid-cols-1 gap-6">
                                    {ESSAY_DATA.map((essay) => (
                                        <div key={essay.id} className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
                                            <h3 className="font-bold text-lg text-indigo-700 border-b border-slate-100 pb-2">{essay.title}</h3>
                                            
                                            {essay.subtitle && (
                                                <p className="italic text-slate-600 font-medium text-sm bg-slate-50 p-3 rounded-lg border border-slate-100">{essay.subtitle}</p>
                                            )}

                                            {/* Câu 1 Format */}
                                            {essay.content && (
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                    {essay.content.map((item, i) => (
                                                        <div key={i} className="p-3 bg-indigo-50/50 rounded-lg border border-indigo-100">
                                                            <div className="font-bold text-indigo-900 text-sm">{item.label}</div>
                                                            <div className="text-slate-700 text-sm mt-1">{item.detail}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            {essay.note && (
                                                <p className="text-xs text-amber-700 font-semibold bg-amber-50 p-2.5 rounded border border-amber-200">{essay.note}</p>
                                            )}

                                            {/* Câu 2 Format (Table) */}
                                            {essay.table && (
                                                <div className="overflow-x-auto">
                                                    <table className="min-w-full text-sm border-collapse border border-slate-200">
                                                        <thead>
                                                            <tr className="bg-indigo-50 text-indigo-900">
                                                                <th className="border border-slate-200 px-3 py-2 text-left font-bold">Tên hình chiếu</th>
                                                                <th className="border border-slate-200 px-3 py-2 text-left font-bold">Hướng chiếu</th>
                                                                <th className="border border-slate-200 px-3 py-2 text-left font-bold">Vị trí đặt trên bản vẽ</th>
                                                                <th className="border border-slate-200 px-3 py-2 text-left font-bold">Kích thước thể hiện</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {essay.table.map((row, i) => (
                                                                <tr key={i} className="hover:bg-slate-50">
                                                                    <td className="border border-slate-200 px-3 py-2 font-semibold text-slate-800">{row.name}</td>
                                                                    <td className="border border-slate-200 px-3 py-2 text-slate-600">{row.direction}</td>
                                                                    <td className="border border-slate-200 px-3 py-2 text-slate-600">{row.position}</td>
                                                                    <td className="border border-slate-200 px-3 py-2 text-slate-600 font-medium text-indigo-700">{row.dimensions}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}

                                            {/* Câu 3 & 6 Parts */}
                                            {essay.partA && (
                                                <div className="space-y-3">
                                                    <div className="font-semibold text-slate-800 text-sm">{essay.partA.title}</div>
                                                    <ul className="list-disc list-inside space-y-1 text-sm text-slate-700 bg-slate-50 p-3 rounded-lg">
                                                        {essay.partA.steps ? essay.partA.steps.map((st, i) => <li key={i}>{st}</li>) : null}
                                                        {essay.partA.items ? essay.partA.items.map((st, i) => <li key={i}>{st}</li>) : null}
                                                    </ul>
                                                </div>
                                            )}
                                            {essay.partB && (
                                                <div className="space-y-3">
                                                    <div className="font-semibold text-slate-800 text-sm">{essay.partB.title}</div>
                                                    <ul className="list-disc list-inside space-y-1 text-sm text-slate-700 bg-slate-50 p-3 rounded-lg">
                                                        {essay.partB.items.map((st, i) => <li key={i}>{st}</li>)}
                                                    </ul>
                                                </div>
                                            )}

                                            {/* Câu 4 & 5 Steps Format */}
                                            {essay.steps && (
                                                <div className="space-y-2">
                                                    {essay.steps.map((s, i) => (
                                                        <div key={i} className="p-3 bg-slate-50 border border-slate-100 rounded-lg text-sm">
                                                            <span className="font-bold text-indigo-700 mr-2">{s.step}:</span>
                                                            <span className="text-slate-700">{s.content}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-800 text-slate-400 text-center py-4 text-xs mt-8">
                        Ứng dụng ôn tập Công Nghệ 8 - Giữa Kì 1 (2026 - 2027) | THCS Nguyễn Hữu Thọ
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
